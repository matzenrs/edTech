# Render Blueprint: hosts Roll-a-Buddy as a free static site.
# Render runs the build command, then serves the files in dist/.
services:
  - type: web
    name: roll-a-buddy
    runtime: static
    buildCommand: npm ci && npm test && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
